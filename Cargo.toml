[workspace]
resolver = "2"
members = ["crates/camu-core", "src-tauri"]

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.82"

[workspace.dependencies]
camu-core = { path = "crates/camu-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
